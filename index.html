<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Árvore de Habilidades</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: auto;
    }.circle-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 100px;
  padding: 100px 50px;
}

.tree {
  position: relative;
  width: 400px;
  height: 400px;
}

.center-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: conic-gradient(#3b82f6 0% 25%, #06b6d4 25% 50%, #fde047 50% 75%, #ef4444 75% 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 1px 1px 2px #000;
  color: #fff;
  z-index: 2;
}

.node {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  border: 3px solid #999;
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
  z-index: 3;
}

.node:hover {
  transform: translate(-50%, -50%) scale(1.1);
  border-color: #fff;
}

.line {
  position: absolute;
  background: #666;
  height: 3px;
  transform-origin: left center;
  z-index: 1;
}

  </style>
</head>
<body>
  <div class="circle-container" id="circleContainer"></div>  <script>
    const container = document.getElementById("circleContainer");
    const icons = Array.from({ length: 100 }, (_, i) => `https://via.placeholder.com/48x48?text=${i + 1}`);

    const createLine = (x1, y1, x2, y2) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      const line = document.createElement("div");
      line.className = "line";
      line.style.width = `${len}px`;
      line.style.left = `${x1}px`;
      line.style.top = `${y1}px`;
      line.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
      return line;
    };

    const createBranch = (tree, x, y, depth, angle, iconIndex, iconsPerTree) => {
      if (depth === 0 || iconIndex >= icons.length || iconIndex % iconsPerTree === 0 && iconIndex !== 0) return;

      const nextX = x + Math.cos(angle) * 70;
      const nextY = y + Math.sin(angle) * 70;

      const node = document.createElement("div");
      node.className = "node";
      node.style.left = `${nextX}px`;
      node.style.top = `${nextY}px`;
      node.style.backgroundImage = `url('${icons[iconIndex]}')`;
      tree.appendChild(node);

      const line = createLine(x, y, nextX, nextY);
      tree.appendChild(line);

      createBranch(tree, nextX, nextY, depth - 1, angle - 0.5, iconIndex + 1, iconsPerTree);
      createBranch(tree, nextX, nextY, depth - 1, angle + 0.5, iconIndex + 2, iconsPerTree);
    };

    const trees = Math.ceil(icons.length / 20);
    for (let t = 0; t < trees; t++) {
      const tree = document.createElement("div");
      tree.className = "tree";

      const center = document.createElement("div");
      center.className = "center-label";
      center.textContent = "Spells";
      tree.appendChild(center);

      createBranch(tree, 200, 200, 4, -Math.PI / 2, t * 20, 20);
      container.appendChild(tree);
    }
  </script></body>
</html>
