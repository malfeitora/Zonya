<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Árvore de Habilidades</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: auto;
    }.tree-container {
  position: relative;
  width: 100vw;
  height: 2000px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.center-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: conic-gradient(#3b82f6 0% 25%, #06b6d4 25% 50%, #fde047 50% 75%, #ef4444 75% 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 1px 1px 2px #000;
  color: #fff;
  z-index: 3;
}

.skill-tree {
  position: absolute;
  width: 300px;
  height: 300px;
}

.node {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  border: 3px solid #999;
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
  z-index: 2;
}

.node:hover {
  transform: translate(-50%, -50%) scale(1.1);
  border-color: #fff;
}

.line {
  position: absolute;
  background: #666;
  height: 3px;
  transform-origin: left center;
  z-index: 1;
}

  </style>
</head>
<body>
  <div class="tree-container" id="treeContainer">
    <div class="center-label" id="centerLabel">Spells</div>
  </div>  <script>
    const container = document.getElementById("treeContainer");
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const icons = Array.from({ length: 100 }, (_, i) => `https://via.placeholder.com/48x48?text=${i + 1}`);

    const createLine = (x1, y1, x2, y2) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      const line = document.createElement("div");
      line.className = "line";
      line.style.width = `${len}px`;
      line.style.left = `${x1}px`;
      line.style.top = `${y1}px`;
      line.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
      return line;
    };

    const createSkillTree = (cx, cy, startIndex) => {
      const tree = document.createElement("div");
      tree.className = "skill-tree";
      tree.style.left = `${cx}px`;
      tree.style.top = `${cy}px`;
      container.appendChild(tree);

      const radius = 120;
      const iconsPerTree = 20;
      for (let i = 0; i < iconsPerTree; i++) {
        const angle = (Math.PI * 2 / iconsPerTree) * i;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;

        const node = document.createElement("div");
        node.className = "node";
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.style.backgroundImage = `url('${icons[startIndex + i]}')`;
        container.appendChild(node);

        const line = createLine(centerX, centerY, x, y);
        container.appendChild(line);
      }
    };

    const trees = 5;
    const radiusFromCenter = 400;
    for (let i = 0; i < trees; i++) {
      const angle = (Math.PI * 2 / trees) * i;
      const x = centerX + Math.cos(angle) * radiusFromCenter;
      const y = centerY + Math.sin(angle) * radiusFromCenter;
      createSkillTree(x, y, i * 20);
    }
  </script></body>
</html>
