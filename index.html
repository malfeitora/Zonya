<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Árvore de Habilidades</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }.tree-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: auto;
}

.skill-tree {
  position: relative;
  width: 1200px;
  height: 1600px;
  background: linear-gradient(to bottom, #1a1a1a, #0d0d0d);
  border-radius: 20px;
  box-shadow: 0 0 20px #000;
  padding: 40px;
}

.node {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  border: 3px solid #888;
  position: absolute;
  transition: transform 0.3s, border-color 0.3s;
  cursor: pointer;
}

.node:hover {
  transform: scale(1.1);
  border-color: #facc15;
}

.line {
  position: absolute;
  background: #555;
  height: 4px;
  transform-origin: left center;
}

  </style>
</head>
<body>
  <div class="tree-container">
    <div class="skill-tree" id="skillTree"></div>
  </div>  <script>
    const skillTree = document.getElementById("skillTree");
    const icons = Array.from({ length: 40 }, (_, i) => `https://via.placeholder.com/64?text=${i+1}`);

    const positions = [
      {x: 500, y: 100}, {x: 400, y: 200}, {x: 600, y: 200},
      {x: 300, y: 300}, {x: 500, y: 300}, {x: 700, y: 300},
      {x: 200, y: 400}, {x: 400, y: 400}, {x: 600, y: 400}, {x: 800, y: 400},
      {x: 100, y: 500}, {x: 300, y: 500}, {x: 500, y: 500}, {x: 700, y: 500}, {x: 900, y: 500},
      {x: 150, y: 600}, {x: 350, y: 600}, {x: 550, y: 600}, {x: 750, y: 600},
      {x: 250, y: 700}, {x: 450, y: 700}, {x: 650, y: 700},
      {x: 350, y: 800}, {x: 550, y: 800},
      {x: 450, y: 900},
      {x: 450, y: 1000},
      {x: 350, y: 1100}, {x: 550, y: 1100},
      {x: 250, y: 1200}, {x: 650, y: 1200},
      {x: 150, y: 1300}, {x: 750, y: 1300},
      {x: 100, y: 1400}, {x: 900, y: 1400},
      {x: 200, y: 1500}, {x: 800, y: 1500},
      {x: 300, y: 1550}, {x: 700, y: 1550},
      {x: 400, y: 1580}, {x: 600, y: 1580}
    ];

    const nodes = [];

    for (let i = 0; i < icons.length; i++) {
      const node = document.createElement("div");
      node.className = "node";
      node.style.left = `${positions[i].x}px`;
      node.style.top = `${positions[i].y}px`;
      node.style.backgroundImage = `url('${icons[i]}')`;
      skillTree.appendChild(node);
      nodes.push({x: positions[i].x + 32, y: positions[i].y + 32, element: node});
    }

    // Criar conexões
    const connections = [
      [0,1],[0,2],[1,3],[1,4],[2,5],[3,6],[3,7],[4,8],[5,9],[6,10],
      [7,11],[8,12],[9,13],[10,14],[11,15],[12,16],[13,17],[14,18],[16,19],
      [17,20],[18,21],[20,22],[21,23],[22,24],[23,25],[25,26],[26,27],
      [27,28],[27,29],[28,30],[29,31],[30,32],[31,33],[32,34],[33,35],
      [34,36],[35,37],[36,38],[37,39]
    ];

    for (const [from, to] of connections) {
      const a = nodes[from];
      const b = nodes[to];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      const line = document.createElement("div");
      line.className = "line";
      line.style.width = `${length}px`;
      line.style.left = `${a.x}px`;
      line.style.top = `${a.y}px`;
      line.style.transform = `rotate(${angle}deg)`;
      skillTree.appendChild(line);
    }
  </script></body>
</html>
