<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Árvore de Habilidades</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
    }.circle-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.center-label {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: conic-gradient(#3b82f6 0% 25%, #06b6d4 25% 50%, #fde047 50% 75%, #ef4444 75% 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  text-shadow: 1px 1px 2px #000;
  color: #fff;
  z-index: 2;
}

.node {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  border: 3px solid #999;
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
  z-index: 3;
}

.node:hover {
  transform: translate(-50%, -50%) scale(1.1);
  border-color: #fff;
}

.line {
  position: absolute;
  background: #666;
  height: 3px;
  transform-origin: left center;
  z-index: 1;
}

  </style>
</head>
<body>
  <div class="circle-container" id="circleContainer">
    <div class="center-label" id="center">Spells</div>
  </div>  <script>
    const container = document.getElementById("circleContainer");
    const center = document.getElementById("center");
    const icons = Array.from({ length: 100 }, (_, i) => `https://via.placeholder.com/48x48?text=${i + 1}`);

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const radius = 300;
    const branchLength = 4; // Nível de profundidade de cada árvore
    const angleStep = (2 * Math.PI) / icons.length;

    const createLine = (x1, y1, x2, y2) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx);
      const line = document.createElement("div");
      line.className = "line";
      line.style.width = `${len}px`;
      line.style.left = `${x1}px`;
      line.style.top = `${y1}px`;
      line.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
      return line;
    };

    const createBranch = (x, y, depth, angle, iconIndex) => {
      if (depth === 0 || iconIndex >= icons.length) return;

      const nextX = x + Math.cos(angle) * 90;
      const nextY = y + Math.sin(angle) * 90;

      const node = document.createElement("div");
      node.className = "node";
      node.style.left = `${nextX}px`;
      node.style.top = `${nextY}px`;
      node.style.backgroundImage = `url('${icons[iconIndex]}')`;
      container.appendChild(node);

      const line = createLine(x, y, nextX, nextY);
      container.appendChild(line);

      createBranch(nextX, nextY, depth - 1, angle - 0.4, iconIndex + 1);
      createBranch(nextX, nextY, depth - 1, angle + 0.4, iconIndex + 2);
    };

    for (let i = 0; i < icons.length; i += branchLength * 2) {
      const angle = i * angleStep;
      const baseX = centerX + Math.cos(angle) * radius;
      const baseY = centerY + Math.sin(angle) * radius;
      const line = createLine(centerX, centerY, baseX, baseY);
      container.appendChild(line);

      createBranch(baseX, baseY, branchLength, angle, i);
    }
  </script></body>
</html>
