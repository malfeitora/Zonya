<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Árvore de Habilidades</title>
  <style>
    body {
      background: #1e1e1e;
      color: #fff;
      font-family: 'Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .tree {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .row {
      display: flex;
      justify-content: center;
      margin: 30px 0;
      position: relative;
    }
    .skill {
      width: 64px;
      height: 64px;
      margin: 0 15px;
      background-color: #333;
      border: 2px solid #888;
      border-radius: 10px;
      background-size: cover;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.3s;
    }
    .skill.locked {
      filter: grayscale(1) brightness(0.5);
      cursor: not-allowed;
    }
    .skill:hover {
      transform: scale(1.1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="tree">
    <canvas id="lines" width="1000" height="1000"></canvas>

    <div class="row" id="row1">
      <div class="skill" id="s1" style="background-image: url('PNG/1.png')"></div>
    </div>
    <div class="row" id="row2">
      <div class="skill locked" id="s2" style="background-image: url('PNG/2.png')"></div>
      <div class="skill locked" id="s3" style="background-image: url('PNG/3.png')"></div>
    </div>
    <div class="row" id="row3">
      <div class="skill locked" id="s4" style="background-image: url('PNG/4.png')"></div>
      <div class="skill locked" id="s5" style="background-image: url('PNG/5.png')"></div>
      <div class="skill locked" id="s6" style="background-image: url('PNG/6.png')"></div>
    </div>
    <div class="row" id="row4">
      <div class="skill locked" id="s7" style="background-image: url('PNG/7.png')"></div>
      <div class="skill locked" id="s8" style="background-image: url('PNG/8.png')"></div>
    </div>
    <div class="row" id="row5">
      <div class="skill locked" id="s9" style="background-image: url('PNG/9.png')"></div>
      <div class="skill locked" id="s10" style="background-image: url('PNG/10.png')"></div>
    </div>
  </div>

  <script>
    const skills = {
      s1: { unlocked: true, unlocks: ['s2', 's3'] },
      s2: { unlocked: false, unlocks: ['s4', 's5'] },
      s3: { unlocked: false, unlocks: ['s5', 's6'] },
      s4: { unlocked: false, unlocks: ['s7'] },
      s5: { unlocked: false, unlocks: ['s7', 's8'] },
      s6: { unlocked: false, unlocks: ['s8'] },
      s7: { unlocked: false, unlocks: ['s9'] },
      s8: { unlocked: false, unlocks: ['s10'] },
      s9: { unlocked: false, unlocks: [] },
      s10: { unlocked: false, unlocks: [] },
    };

    const updateSkillStyles = () => {
      for (const id in skills) {
        const el = document.getElementById(id);
        if (skills[id].unlocked) {
          el.classList.remove("locked");
        } else {
          el.classList.add("locked");
        }
      }
    };

    document.querySelectorAll('.skill').forEach(skill => {
      skill.addEventListener('click', () => {
        const id = skill.id;
        if (!skills[id].unlocked) return;

        skills[id].unlocks.forEach(unlockId => {
          skills[unlockId].unlocked = true;
        });

        updateSkillStyles();
        drawLines();
      });
    });

    updateSkillStyles();

    // Desenhar linhas
    const drawLines = () => {
      const canvas = document.getElementById('lines');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 2;

      for (const id in skills) {
        const skill = document.getElementById(id);
        const rect1 = skill.getBoundingClientRect();
        const x1 = rect1.left + rect1.width / 2 - canvas.offsetLeft;
        const y1 = rect1.top + rect1.height / 2 - canvas.offsetTop;

        skills[id].unlocks.forEach(targetId => {
          const target = document.getElementById(targetId);
          const rect2 = target.getBoundingClientRect();
          const x2 = rect2.left + rect2.width / 2 - canvas.offsetLeft;
          const y2 = rect2.top + rect2.height / 2 - canvas.offsetTop;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        });
      }
    };

    window.addEventListener('load', () => {
      drawLines();
    });

    window.addEventListener('resize', () => {
      drawLines();
    });
  </script>
</body>
</html>
